[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:xvfb]
command=Xvfb :1 -screen 0 1280x800x24
autorestart=true
priority=10

[program:xfce]
command=startxfce4
environment=DISPLAY=":1",HOME="/home/dev"
user=dev
autorestart=true
priority=20

[program:x11vnc]
command=x11vnc -display :1 -forever -shared -rfbauth /etc/x11vnc/passwd -rfbport 5900 -localhost
autorestart=true
priority=30

[program:novnc]
command=websockify --web /usr/share/novnc 127.0.0.1:6081 127.0.0.1:5900
autorestart=true
priority=40

[program:sshd]
command=/usr/sbin/sshd -D -e
autorestart=true
priority=40

; websocat: принимает WSS на /ssh и проксирует в sshd:22
[program:websocat]
command=/usr/local/bin/websocat --binary ws-l:127.0.0.1:8080 tcp:127.0.0.1:22
autorestart=true
priority=50

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
priority=60
